spring.application.name=media_backlog_api
server.port=8081

# Names temporary database
spring.datasource.url=jdbc:h2:file:./media_db

# Standard H2 configuration
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Turns on the web based database viewer
spring.h2.console.enabled=true

# Tells JPA to auto-create our sql tables based on our Java Classes
spring.jpa.hibernate.ddl-auto=update